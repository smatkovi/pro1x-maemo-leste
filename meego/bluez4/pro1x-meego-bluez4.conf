<!-- Harmattan's bluetoothd (bluez 4.91), which the MeeGo session runs in
     place of Leste's bluez 5 (meego/40-harmattan-session.sh), calls the
     system UI's pairing agent and the audio endpoints through bluez 4's
     interfaces; Leste's bluetooth.conf (bluez 5) lets root send only to
     bluez 5's, and the system bus refuses the others. As in Harmattan's
     own bluetooth.conf. Installed by meego/41-leste-helpers.sh. -->

<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow send_interface="org.bluez.Agent"/>
    <allow send_interface="org.bluez.HandsfreeAgent"/>
    <allow send_interface="org.bluez.MediaEndpoint"/>
    <allow send_interface="org.bluez.Watcher"/>
  </policy>
</busconfig>
