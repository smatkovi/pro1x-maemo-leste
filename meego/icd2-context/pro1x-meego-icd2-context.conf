<!-- Harmattan's Internet.* context properties (the status bar's WLAN icon)
     from Leste's icd2: meego/icd2-context/icd2-context.py, which the MeeGo
     session (meego/40-harmattan-session.sh) runs as root under the name
     Harmattan's own icd2 used. Installed by meego/41-leste-helpers.sh. -->

<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.nokia.icd2.context"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.nokia.icd2.context"/>
  </policy>
</busconfig>
