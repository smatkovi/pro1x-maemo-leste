<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Starts the Leste applications listed in /etc/pro1x-meego/leste-apps
     from the MeeGo session (meego/leste-apps/leste-apps.py). -->
<busconfig>
  <policy user="root">
    <allow own="org.pro1x.LesteLauncher"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.pro1x.LesteLauncher"/>
  </policy>
</busconfig>
