# Pro1X: the modem's remote filesystem in the rmtfs_mem region, as on Leste.
# rmtfs -s also starts the modem, which serves the Wi-Fi as well.
#
# Debian's unit has ConditionPathExists=/dev/qcom_rmtfs_mem1, which systemd
# checks before ExecStartPre: a start before udev loaded rmtfs_mem was
# skipped (rmtfs 1.3's udev rule starts it again later, older ones have
# none). The condition goes; ExecStartPre loads the module and waits for
# it and for the modem's remoteproc, without which `rmtfs -s` exits at
# once (the restarts then ran into the start limit and stopped for good).
[Unit]
ConditionPathExists=
Wants=tqftpserv.service
After=tqftpserv.service
StartLimitIntervalSec=0

[Service]
ExecStartPre=-/sbin/modprobe -q rmtfs_mem
# The IPA (mobile data) before the modem: its probe loads the GSI firmware
# through TrustZone without the modem (qcom,gsi-loader = "self"), and it
# then sees the modem's start (SSR "starting"/"running").
ExecStartPre=-/sbin/modprobe -q ipa
ExecStartPre=-/usr/lib/pro1x/pro1x-modem-wait remoteproc
TimeoutStartSec=180
ExecStart=
ExecStart=/usr/bin/rmtfs -r -P -s
Restart=always
RestartSec=1
