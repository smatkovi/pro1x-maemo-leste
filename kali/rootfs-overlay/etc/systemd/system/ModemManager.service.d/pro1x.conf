# Pro1X: ModemManager once the modem is up (as the NixOS port orders it).
#
# The modem is a QRTR node (qcom-soc plugin: control port qrtr<node>, data
# through the IPA's rmnet_ipa0). ModemManager 1.24 takes a QRTR node only
# if WDS, DMS and NAS appear within 4 s of its first service, so it waits
# for them here (at most 90 s; it starts anyway after that). After a modem
# restart the same 4 s apply again: if `mmcli -L` then stays empty,
# `systemctl restart ModemManager`.
[Unit]
Wants=rmtfs.service tqftpserv.service
After=rmtfs.service tqftpserv.service

[Service]
ExecStartPre=-/usr/lib/pro1x/pro1x-modem-wait qmi
TimeoutStartSec=180
