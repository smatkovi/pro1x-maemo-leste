# Pro1X (Kali and Arch, PipeWire): the sound card suspends after 3 s of
# silence instead of WirePlumber's 5 s (the N9 used 1-5 s; the card open
# costs about 100 mA). Up to kernel 7.1.0-pro1x.7 every resume of the card
# popped in the loudspeaker; patch 0026 (pro1x.8 and later) fixes that, which
# WirePlumber cannot check by itself. A pop with the new kernel: set 300 here
# (or remove the file for the 5 s default) and restart WirePlumber.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 3
      }
    }
  }
]
