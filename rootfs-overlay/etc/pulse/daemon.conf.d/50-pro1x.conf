# Pro1X (sm4250/q6afe): the DSP paths run at 48 kHz and 16 bit. PulseAudio
# otherwise sat at 44.1 kHz and resampled -- the loudspeaker crackled.
# 24 bit comes out about 40 dB too quiet on this card (NixOS port).
default-sample-format = s16le
default-sample-rate = 48000
alternate-sample-rate = 48000
avoid-resampling = yes
