# Pro1X (sm4250/q6afe): die DSP-Pfade laufen mit 48 kHz und 16 Bit. PulseAudio
# stand sonst auf 44,1 kHz und rechnete um -- im Lautsprecher knackte es.
# 24 Bit kommt auf dieser Karte rund 40 dB zu leise heraus (NixOS-Port).
default-sample-format = s16le
default-sample-rate = 48000
alternate-sample-rate = 48000
avoid-resampling = yes
