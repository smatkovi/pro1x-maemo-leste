# Pro1X: dirty pages written back in fewer, larger batches. The flusher
# looks for expired dirty pages every 15 s instead of every 5 s (while
# there are any), and a page is expired after 30 s, matching the root's and
# /host's ext4 journal commit=30 (initramfs/local-top/pro1x-loop-root,
# fstab): less often the UFS disk and the CPU woken for a few log lines.
# A sync, fsync or unmount still writes at once. Up to about 45 s of writes
# are lost when the phone is reset by the power key. Back to the kernel's
# 5 s / 30 s: remove this file (or sysctl -w vm.dirty_writeback_centisecs=500).
vm.dirty_writeback_centisecs = 1500
vm.dirty_expire_centisecs = 3000
