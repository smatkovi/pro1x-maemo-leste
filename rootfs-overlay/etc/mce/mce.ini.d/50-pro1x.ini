# mce settings for the F(x)tec Pro1X.
# Sits between 10-maemo.ini and 99-user.ini, so keep putting your own values
# into 99-user.ini.

[Modules]
# Keyboard backlight (white:kbd_backlight) and vibration motor (AW86224 as a
# force-feedback input device); both are missing from Leste's default list.
# Accelerometer (orientation) and proximity (blank the screen during calls)
# come from the ADSP sensors through iio-sensor-proxy; the light sensor is
# already used by filter-brightness-als-iio. led-sw drives the RGB status LED
# (charging, notifications) with the patterns from [LEDGenericSoftware];
# led-dbus provides req_led_pattern_activate, which notifications use.
ModulesUser=button-backlight;evdevvibrator;iio-accelerometer;iio-proximity;led-sw;led-dbus

[LED]
# The status LED as the N900 used it: lit only while something waits, no
# "device on" light (Leste's mce.ini blinks it white, all three colours at
# full brightness, 1 s in every 6, whenever the display is off). Leste's
# list without PatternDeviceOn, with PatternBatteryLow (mce raises it with
# patches/fixes/mce.patch) and Harmattan's PatternCommunication (the MeeGo
# copy's name for any message). Back to Leste's: remove LEDPatterns here.
LEDPatterns=PatternError;PatternPowerOn;PatternPowerOff;PatternCommunicationCall;PatternCommunicationIM;PatternCommunicationSMS;PatternCommunicationEmail;PatternCommonNotification;PatternCommunication;PatternWebcamActive;PatternBatteryCharging;PatternBatteryFull;PatternBatteryLow;PatternDeviceSoftOff;PatternBoost

[LEDGenericSoftware]
# The PMI632 LPG status LED, split into one sysfs LED per colour by the
# Leste device-tree patch (device/kernel/patches/0001-*).
Monochromic=0
RedSysfs=red:status
GreenSysfs=green:status
BlueSysfs=blue:status
# Fields: priority (lower wins); policy (0: display off, 1: on or off,
# 4: off or acting dead); timeout s; red; green; blue; on ms; off ms.
# Missed call, SMS, chat, e-mail, other notifications (hildon-home's
# notification groups name them while the notification is unread): blue,
# as the N900, a short flash every 3 s (Leste's: half a second every 2.5 s).
PatternCommunicationCall=25;1;0;0;0;255;150;2850
PatternCommunicationSMS=26;1;0;0;0;255;150;2850
PatternCommunicationEmail=27;1;0;0;0;255;150;2850
PatternCommunicationIM=28;1;0;0;0;255;150;2850
PatternCommonNotification=30;1;0;0;0;255;150;2850
PatternCommunication=29;1;0;0;0;255;150;2850
# battery low (upower's warning level, display off): a red flash every 5 s
PatternBatteryLow=45;0;0;255;0;0;150;4850
# not used (not in LEDPatterns); zero brightness also makes mce skip it
PatternDeviceOn=254;0;0;0;0;0;1000;5000

[Backlights]
ConfiguredLights=white:kbd_backlight
# Fields: hidden_by_slider;is_keyboard;on_when_dimmed;on_when_locked;
#         fade_time;profile(0 = KeyboardBrightness)
# The LED only knows on/off (max_brightness 1); the kernel clamps larger values.
white:kbd_backlight=1;1;0;0;0;0

[Display]
# The panel's low power mode (mce patched with patches/lpm): after blanking
# the panel keeps showing the stand-by screen (pro1x-standby -M) at 20 %,
# as the N9 did; covered for 5 s it goes dark. Older mce ignores these.
UseLowPowerMode=1
LowPowerModeBrightness=20
# the stand-by screen for a minute, then the display off (0: until covered)
LowPowerModeBlankTimeout=60
