# mce-Einstellungen fuer das F(x)tec Pro1X.
# Liegt zwischen 10-maemo.ini und 99-user.ini, eigene Werte also weiter in
# 99-user.ini setzen.

[Modules]
# Tastaturbeleuchtung (white:kbd_backlight) und Vibrationsmotor (AW86224 als
# Force-Feedback-Eingabegeraet); beide fehlen in der Leste-Standardliste.
ModulesUser=button-backlight;evdevvibrator

[Backlights]
ConfiguredLights=white:kbd_backlight
# Felder: verdeckt_durch_Schieber;ist_Tastatur;an_wenn_gedimmt;an_wenn_gesperrt;
#         Ueberblendzeit;Profil(0 = KeyboardBrightness)
# Die LED kennt nur an/aus (max_brightness 1); der Kernel kappt groessere Werte.
white:kbd_backlight=1;1;0;0;0;0
