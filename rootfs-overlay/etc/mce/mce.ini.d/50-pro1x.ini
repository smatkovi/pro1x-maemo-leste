# mce settings for the F(x)tec Pro1X.
# Sits between 10-maemo.ini and 99-user.ini, so keep putting your own values
# into 99-user.ini.

[Modules]
# Keyboard backlight (white:kbd_backlight) and vibration motor (AW86224 as a
# force-feedback input device); both are missing from Leste's default list.
ModulesUser=button-backlight;evdevvibrator

[Backlights]
ConfiguredLights=white:kbd_backlight
# Fields: hidden_by_slider;is_keyboard;on_when_dimmed;on_when_locked;
#         fade_time;profile(0 = KeyboardBrightness)
# The LED only knows on/off (max_brightness 1); the kernel clamps larger values.
white:kbd_backlight=1;1;0;0;0;0
