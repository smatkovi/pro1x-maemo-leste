<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  MeeGo Harmattan (meego/40-harmattan-session.sh) runs its user interface
  as "user" on Leste's system bus, next to Leste's mce, dsme and icd2,
  which speak the same Nokia interfaces. Its UI services need their names.
-->
<busconfig>
  <policy user="user">
    <allow own_prefix="com.nokia"/>
    <allow own_prefix="com.Nokia"/>
    <allow own_prefix="com.meego"/>
    <allow own_prefix="org.freedesktop.ohm"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.nokia.bt_ui"/>
    <allow send_destination="com.nokia.cellui.pin"/>
    <allow send_destination="com.nokia.cellular_ui"/>
    <allow send_destination="com.nokia.oma_cp_ui"/>
    <allow send_destination="com.nokia.ShortMessageHandler"/>
    <allow send_destination="com.nokia.simlock"/>
    <allow send_destination="com.nokia.icd_ui"/>
    <allow send_destination="com.nokia.mms"/>
    <allow send_destination="com.nokia.NonGraphicFeedback1.Backend"/>
    <allow send_destination="com.nokia.location.nped"/>
    <allow send_destination="com.nokia.policy"/>
    <allow send_destination="org.freedesktop.ohm.Policy"/>
    <allow send_destination="com.nokia.policy.pcfd"/>
    <allow send_destination="com.nokia.SMS.Ring"/>
    <allow send_destination="com.Nokia.Telephony.Tones"/>
    <allow send_destination="com.nokia.usetime"/>
    <allow send_destination="com.nokia.wps_ui"/>
    <allow send_destination="com.nokia.time"/>
    <allow send_destination="com.nokia.SensorService"/>
    <allow send_destination="com.meego.usb_moded"/>
    <allow send_destination="com.nokia.csd"/>
    <allow send_destination_prefix="com.nokia.csd"/>
  </policy>
  <!-- Harmattan's system-wide GConf daemon (root, in the chroot) -->
  <policy context="mandatory">
    <allow own="org.gnome.GConf"/>
    <allow send_destination="org.gnome.GConf"/>
    <allow receive_sender="org.gnome.GConf"/>
  </policy>
</busconfig>
