# libssc: how the ADSP's sensor core delivers sensor events (docs/sensors.md).
# Read by every libssc client (iio-sensor-proxy for mce, the MeeGo session's
# n9-sensors, pro1x-steps, ssccli) when it opens a sensor; a client may set
# its own. Without this file every event is sent at once and may wake the
# system, as before (the way back: delete or empty it, then restart the
# clients or reboot).
[delivery]
# Streaming sensors (accelerometer, gyroscope, magnetometer, rotation
# vector): their samples wait up to this many milliseconds in the sensor
# core and go out together, one report and one wakeup for several. mce's
# orientation through iio-sensor-proxy reacts that much later at most.
continuous-batch-ms=200
# These never wake a suspended system: the sensor core keeps their events
# and sends them after the resume. The proximity sensor is not among them
# (a call).
no-wakeup=accel;gyro;mag;rotv;ambient_light;pedometer
