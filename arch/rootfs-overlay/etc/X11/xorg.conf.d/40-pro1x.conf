# Pro1X: the 1080x2160 panel is used in landscape, keyboard towards the user.
Section "Monitor"
	Identifier "DSI-1"
	Option "Rotate" "right"
EndSection

# X does not turn absolute touch input with the screen.
Section "InputClass"
	Identifier "Pro1X touchscreen"
	MatchProduct "Goodix Capacitive TouchScreen"
	Option "TransformationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection
