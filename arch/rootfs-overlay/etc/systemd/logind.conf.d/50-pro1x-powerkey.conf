# The power key powers the phone off only when held (5 s). A short press is
# the session's: Phosh's settings daemon takes it (power-button-action),
# the X sessions have pro1x-powerkey-x (the screen dark or back); without a
# session it does nothing. logind's default powered off at a short press.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
