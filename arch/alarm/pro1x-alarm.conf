<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Alarms on the F(x)tec Pro1X's Arch (arch/alarm, docs/alarm-power-on.md):
     alarmd runs in the Hildon session as the user alarm (Leste's policy
     names its user "user", and Arch's alarmd package has it below /usr/etc,
     where the bus does not look). The system UI's own policy lets anyone
     own com.nokia.system_ui. -->
<busconfig>
  <policy user="root">
    <allow own="com.nokia.alarmd"/>
  </policy>
  <policy user="alarm">
    <allow own="com.nokia.alarmd"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.nokia.alarmd"/>
    <allow send_interface="com.nokia.alarmd"/>
    <allow receive_sender="com.nokia.alarmd"/>
    <allow receive_interface="com.nokia.alarmd.*"/>
  </policy>
</busconfig>
