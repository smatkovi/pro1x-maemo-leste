# pro1x-waydroid: Waydroid's network (waydroid-net.sh) runs its own dnsmasq
# for the container on the bridge waydroid0 (192.168.240.1). Leste's
# dnsmasq listens on every address of the wildcard, which keeps that one
# from binding ("Address already in use"); as lxc-net's documentation
# says, the system's dnsmasq binds the interfaces' addresses one by one
# (also those that come later) and leaves Waydroid's bridge and LXC's
# (lxcbr0, lxc-net) alone.
bind-dynamic
except-interface=waydroid0
except-interface=lxcbr0
