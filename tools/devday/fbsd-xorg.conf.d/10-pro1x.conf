# F(x)tec Pro1X, for tools/devday/fbsd-x.sh (userdata freebsd/xorg.conf.d):
# the root image's, with the touchscreen matched by its name. The matrix
# is the one touchcal.sh measured on 2026-11-02 (raw y along the width,
# raw x against the height), the same as the image's; the turned swipes
# came from moused moving the pointer a second time through sysmouse.
Section "Device"
	Identifier	"Framebuffer"
	Driver		"scfb"
	Option		"Rotate" "CW"
EndSection

Section "InputClass"
	Identifier	"Pro1X touchscreen"
	MatchProduct	"Goodix"
	Option		"TransformationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection
