# F(x)tec Pro1X, the test of 2026-11-01 (tools/devday/fbsd-x.sh): as the
# root image's, but the touchscreen without a transformation: swipes went
# 90 degrees turned with "0 1 0 -1 0 1 0 0 1", the controller already
# reports in the rotated screen's directions.
Section "Device"
	Identifier	"Framebuffer"
	Driver		"scfb"
	Option		"Rotate" "CW"
EndSection
