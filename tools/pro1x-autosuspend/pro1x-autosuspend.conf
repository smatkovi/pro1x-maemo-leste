# pro1x-autosuspend (tools/pro1x-autosuspend); times in seconds
[autosuspend]
# with the display off this long, the system may suspend
Delay=30
# wake-up while suspended, so that mail and messengers can catch up (0: none)
WakeInterval=900
# up this long after any wake-up (Wi-Fi reconnects first: no WoWLAN yet)
StayAwake=45
# stopped for each suspend, started again after it: with hexagonrpcd running
# the ADSP's sensor process crashes in a suspend (postmarketOS and Debian
# stop it too)
StopServices=pro1x-hexagonrpcd
# devices that may not wake the system: the Bluetooth UART's wake-up
# interrupt fires at once (no in-band sleep in mainline's hci_qca)
NoWakeup=4a8c000.serial
# suspend also with a USB cable in (USB does not come back from it yet)
SuspendOnUSB=false
