# pro1x-autosuspend (tools/pro1x-autosuspend); times in seconds
[autosuspend]
# with the display off this long, the system may suspend
Delay=30
# wake-up while suspended, so that mail and messengers can catch up (0: none)
WakeInterval=900
# up this long after any wake-up (Wi-Fi reconnects first: no WoWLAN yet)
StayAwake=45
# stopped for each suspend, started again after it. Not set: hexagonrpcd,
# and only on a kernel without patch 0031 (pro1x.10: FastRPC calls frozen in
# place, /sys/module/fastrpc/parameters/freezable_invoke Y); there the ADSP's
# sensor process crashes at the thaw (postmarketOS and Debian stop it too).
# Empty: nothing.
#StopServices=pro1x-hexagonrpcd
# devices that may not wake the system: the Bluetooth UART's wake-up
# interrupt woke the first suspend at once. Left alone while Bluetooth's own
# switch is on (echo enabled > /sys/bus/serial/devices/serial0/power/wakeup);
# with kernel patch 0030 (pro1x.10) the UART then wakes it only while
# Bluetooth is up
NoWakeup=4a8c000.serial
# suspend also with a USB cable in (before kernel patch 0032, pro1x.10, the
# USB gadget did not come back from a suspend)
SuspendOnUSB=false
