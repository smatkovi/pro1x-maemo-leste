<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The modem's calls and SMS (freebsd/modem, pro1x-modemd) as oFono's
     API: org.ofono, owned by root, used by the session's apps (sphone). -->
<busconfig>
  <policy user="root">
    <allow own="org.ofono"/>
    <allow send_destination="org.ofono"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ofono"/>
  </policy>
</busconfig>
