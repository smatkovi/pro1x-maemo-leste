# sphone on FreeBSD on the Pro1X (freebsd/modem/README.md): calls in
# landscape. sphone's call window asks for portrait, for which
# hildon-desktop rotates the screen's CRTC; FreeBSD's display (scfb) and
# the test VM's X server cannot rotate, and the picture goes black.
[Gui]
LandscapeCalls=1

# Calls only, as on Leste (leste-config's 00-maemo-voicecallmanager.ini):
# the SMS are Conversations', through telepathy-ring (freebsd/modem/
# README.md); sphone handling them too would log and announce every
# message twice
[Sphone]
Features=calls

# sphone's modules with route-pro1x (freebsd/hildon/patches/sphone/0002):
# the Speaker button and the handset route during a call go to
# pro1x-callaudio (the call's voice does not pass PulseAudio here). The
# calls through comm-ofono (Leste: comm-voicecallmanager, on voicecall-qt5,
# which FreeBSD's Hildon has not), without the messages UI (as Leste)
[Modules]
Modules=rtconf-libprofile;route-pulseaudio;route-pro1x;playback-gstreamer;sphone-mce;comm-ofono;commtest;manager;external-exec;contacts-evolution;comm-error-gtk;contacts-ui-abook;store-rtcom;ui-dialer-gtk;ui-dtmf-gtk;ui-history-calls-gtk;ui-options-gtk;notify-libnotify;ui-calls-manager-gtk
