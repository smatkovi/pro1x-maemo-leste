# sphone on FreeBSD on the Pro1X (freebsd/modem/README.md): calls in
# landscape. sphone's call window asks for portrait, for which
# hildon-desktop rotates the screen's CRTC; FreeBSD's display (scfb) and
# the test VM's X server cannot rotate, and the picture goes black.
[Gui]
LandscapeCalls=1

# sphone's modules with route-pro1x (freebsd/hildon/patches/sphone/0002):
# the Speaker button and the handset route during a call go to
# pro1x-callaudio (the call's voice does not pass PulseAudio here)
[Modules]
Modules=rtconf-libprofile;route-pulseaudio;route-pro1x;playback-gstreamer;sphone-mce;comm-ofono;commtest;manager;external-exec;contacts-evolution;comm-error-gtk;contacts-ui-abook;store-rtcom;ui-dialer-gtk;ui-dtmf-gtk;ui-history-calls-gtk;ui-messages-gtk;ui-options-gtk;ui-message-threads-gtk;notify-libnotify;ui-calls-manager-gtk
