<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The hardware step counter (tools/pro1x-steps): read by everyone. -->
<busconfig>
  <policy user="root">
    <allow own="org.pro1x.Steps"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.pro1x.Steps"/>
  </policy>
</busconfig>
