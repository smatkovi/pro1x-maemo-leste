<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- location-daemon (FreeBSD): owned by root, which D-Bus activation runs
     it as; liblocation's "start" call activates it, its signals are
     everyone's. -->
<busconfig>
  <policy user="root">
    <allow own="org.maemo.LocationDaemon"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.maemo.LocationDaemon"/>
  </policy>
</busconfig>
