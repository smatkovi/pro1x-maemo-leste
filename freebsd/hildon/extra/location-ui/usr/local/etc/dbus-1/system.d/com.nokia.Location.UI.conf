<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- location-ui (FreeBSD): run by hildon-session as root, the session's
     user on the Pro1X; liblocation's clients ask it for its dialogs. -->
<busconfig>
  <policy user="root">
    <allow own="com.nokia.Location.UI"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.nokia.Location.UI"/>
  </policy>
</busconfig>
