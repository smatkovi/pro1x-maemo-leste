<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- pro1x-standby (tools/pro1x-standby) where no mce runs: it takes mce's
     name for the display's requests (req_display_state_on,
     req_display_blanking_pause, get_display_status) and its settings
     (get_/set_display_timeout, _display_brightness, _inhibit_timout_mode:
     the control panel's Display) from everyone, as Leste's mce does; it
     answers other requests with an error. -->
<busconfig>
  <policy user="root">
    <allow own="com.nokia.mce"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.nokia.mce"
           send_interface="com.nokia.mce.request"/>
  </policy>
</busconfig>
