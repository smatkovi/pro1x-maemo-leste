# The Pro1X (freebsd/rootfs; base's /etc/sysctl.conf has only comments).
#
# syslogd's kernel log looked at once a second instead of five times
# (logtimeout: 5 wake-ups a second while syslogd has /dev/klog open;
# kernel messages reach the log at most a second later). Measured in the
# VM's Hildon session (pm/test/vm-wakeups.sh): 285 of 60 s.
kern.log_wakeups_per_second=1
