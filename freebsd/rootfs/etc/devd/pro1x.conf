# The power key (qcom_pon): held for 2 s, the phone powers off.
notify 10 {
	match "system"		"PMIC";
	match "subsystem"	"POWER";
	action "/usr/local/sbin/pro1x-powerkey $type";
};

# The battery changed (pro1x_battery: status, capacity, charger): the
# status LED follows, nothing polls
notify 10 {
	match "system"		"PRO1X";
	match "subsystem"	"BATTERY";
	match "type"		"CHANGE";
	action "/usr/local/libexec/pro1x-statusled $status";
};
