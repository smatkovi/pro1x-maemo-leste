# FreeBSD on the F(x)tec Pro1X (repo freebsd/rootfs): the root is a read-only
# image on userdata, /var and /tmp live in memory.
hostname="pro1x-freebsd"

root_rw_mount="NO"
varmfs="YES"
varsize="128m"
populate_var="YES"
tmpmfs="YES"
tmpsize="128m"

# Nothing to save into on a read-only root
entropy_file="NO"
entropy_boot_file="NO"
dumpdev="NO"

# The writable ZFS pool (pool.zfs; the RAM root set pro1x.rootrw): /var on
# the root, so that pkg's database, logs and the entropy file stay; the
# pool's other datasets (pro1x/root: root's home) mounted
if [ "$(/bin/kenv -q pro1x.rootrw 2> /dev/null)" = 1 ]; then
	varmfs="NO"
	populate_var="NO"
	entropy_file="/var/db/entropy-file"
	entropy_boot_file="/boot/entropy"
	zfs_enable="YES"
fi

sendmail_enable="NONE"
syslogd_flags="-ss"
devd_enable="YES"
dbus_enable="YES"

# CPU frequency (qcom_cpufreq_hw): down when idle, up under load; adaptive
# also on a charger (the default there, hiadaptive, polls 4 times a second
# for ever), looked at every 500 ms. The N9 ran the kernel's ondemand
# governor down to 300 MHz (/etc/pmconfig).
powerd_enable="YES"
powerd_flags="-a adaptive -b adaptive -n adaptive -p 500"

# No cron: its jobs (periodic, adjkerntz) are for a server and a read-only
# root has nothing for them; it would only wake the phone every minute
cron_enable="NO"

# Wi-Fi (freebsd/dsp/README.md, runs dsp6 and dsp7): the modem with its
# servers (the WLAN firmware runs on it), then ath10k (rc.d/pro1x_wifi),
# whose device ath10k0 gets wlan0. Off until the device tests pass. The
# network to join: wpa_supplicant.conf(5) next to the kernel on userdata
# (/host/freebsd/wpa_supplicant.conf from Linux), never in the image.
#tqftpserv_enable="YES"
#pd_mapper_enable="YES"
#rmtfs_enable="YES"
#pro1x_modem_enable="YES"
#pro1x_wifi_enable="YES"
wlans_ath10k0="wlan0"
# The FM radio (freebsd/fm/README.md): the daemon behind the app, which
# brings the Bluetooth chip up when the receiver is switched on. Off until
# the device tests pass (pro1x.test=fm).
#pro1x_fmd_enable="YES"
# Calls, SMS, the SIM, the network (freebsd/modem/README.md): the modem as
# above, pro1x-modemd as oFono's D-Bus API for sphone, the voice path of a
# call on the ADSP; GPS through gpsd. Off until the device tests pass
# (pro1x.test=modem).
#pro1x_modemd_enable="YES"
#pro1x_modemd_flags="-A /usr/local/sbin/pro1x-callaudio"
ifconfig_wlan0="WPA DHCP"
wpa_supplicant_conf_file="/dev/pro1x-host/freebsd/wpa_supplicant.conf"
