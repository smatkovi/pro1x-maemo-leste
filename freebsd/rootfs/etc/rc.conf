# FreeBSD on the F(x)tec Pro1X (repo freebsd/rootfs): the root is a read-only
# image on userdata, /var and /tmp live in memory.
hostname="pro1x-freebsd"

root_rw_mount="NO"
varmfs="YES"
varsize="128m"
populate_var="YES"
tmpmfs="YES"
tmpsize="128m"

# Nothing to save into on a read-only root
entropy_file="NO"
entropy_boot_file="NO"
dumpdev="NO"

sendmail_enable="NONE"
syslogd_flags="-ss"
devd_enable="YES"
dbus_enable="YES"

# CPU frequency (qcom_cpufreq_hw): down when idle, up under load
powerd_enable="YES"
