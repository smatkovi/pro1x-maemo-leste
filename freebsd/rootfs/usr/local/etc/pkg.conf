# pkg(8) on the Pro1X.
#
# The repository catalogue is unpacked into a temporary file in $TMPDIR,
# else /tmp, and pkg refuses an entry larger than half the free space there
# (libpkg/pkg_repo.c, pkg_repo_get_temp_limit). /tmp is a 128 MB tmpfs
# (rc.conf tmpsize): FreeBSD-ports' catalogue did not fit ("repository
# archive entry is too large: data", then "no signature found" and
# "repository FreeBSD-ports cannot be opened"). /var/tmp is on the root,
# the writable pool where pkg can change anything at all.
PKG_ENV {
	TMPDIR: "/var/tmp"
}
