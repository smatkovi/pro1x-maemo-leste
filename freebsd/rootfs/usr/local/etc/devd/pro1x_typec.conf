# The USB-C port's changes from pro1x_typec (freebsd/pm/README.md, stage
# 4b): ATTACH or DETACH with role=device|host|audio|debug,
# orientation=cc1|cc2, vbus, rp (the source's current in mA); the
# controller's role follows (pro1x-usbrole, off unless pro1x.usbrole=1)
notify 10 {
	match "system"		"PRO1X";
	match "subsystem"	"TYPEC";
	action "logger -t pro1x_typec \"$type role=$role orientation=$orientation vbus=$vbus rp=$rp\"; /usr/local/libexec/pro1x-usbrole $type $role $orientation";
};
