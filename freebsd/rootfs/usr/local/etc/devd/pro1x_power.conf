# A cable or a charger ends a suspend in progress (pro1x-autosleep,
# pro1x-suspend; freebsd/pm/README.md, stage 6): neither raises an
# interrupt of its own that ends the CPUs' freeze, the Type-C port's
# change and the battery's are seen between its epochs (5 s), and then
# hw.pro1x_pm.wake=1 ends it. Harmless while nothing is suspended.
notify 20 {
	match "system"		"PRO1X";
	match "subsystem"	"TYPEC";
	match "type"		"ATTACH";
	action "/usr/local/libexec/pro1x-power-wake typec";
};
notify 20 {
	match "system"		"PRO1X";
	match "subsystem"	"BATTERY";
	match "type"		"CHANGE";
	action "/usr/local/libexec/pro1x-power-wake battery";
};
