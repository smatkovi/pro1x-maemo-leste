# F(x)tec Pro1X: X on KMS (freebsd/gpu/kms.md), the second configuration
# beside xorg.conf.d's scfb one: Xorg -configdir /usr/local/etc/X11/xorg-kms.conf.d
# (tools/devday/fbsd-x.sh ... kms, pro1x-gputest kms3/kms4). Needs msm.ko
# loaded with hw.msm.kms=1 (and hw.msm.vram=256m): /dev/dri/card0 is then
# the display Linux left running and the Adreno 610 in one device.
#
# The modesetting driver with glamor (EGL on GBM on card0: Mesa's freedreno),
# DRI3 for the clients; the panel is portrait (1080 x 2160), the screen turned
# right for the landscape keyboard as with scfb's Rotate "CW" (RandR's
# rotation: glamor turns the screen into a shadow buffer the panel scans).
Section "ServerFlags"
	# no second GPU screens from the platform bus
	Option		"AutoAddGPU" "false"
EndSection

Section "Device"
	Identifier	"KMS"
	Driver		"modesetting"
	Option		"kmsdev" "/dev/dri/card0"
	Option		"AccelMethod" "glamor"
	# no cursor plane: X draws the pointer
	Option		"SWcursor" "on"
	Option		"Monitor-DSI-1" "Panel"
EndSection

Section "Monitor"
	Identifier	"Panel"
	Option		"Rotate" "right"
EndSection

# libinput's own calibration, as in xorg.conf.d/10-pro1x.conf: the screen is
# turned the same way
Section "InputClass"
	Identifier	"Pro1X touchscreen"
	MatchIsTouchscreen "on"
	Option		"CalibrationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection
