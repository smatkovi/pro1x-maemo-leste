# F(x)tec Pro1X: the bootloader's framebuffer (vt_simplefb) through scfb,
# turned right for the landscape keyboard as in the MeeGo session
# (meego/40-harmattan-session.sh); the touchscreen is turned along.
Section "Device"
	Identifier	"Framebuffer"
	Driver		"scfb"
	Option		"Rotate" "CW"
EndSection

# libinput's own calibration, before X: the server's TransformationMatrix
# was read but left the touches where the panel reports them (ptrlog,
# 2026-11-02). Raw y runs along the screen's width, raw x against its
# height (tools/devday/fbsd-touchcal.sh)
Section "InputClass"
	Identifier	"Pro1X touchscreen"
	MatchIsTouchscreen "on"
	Option		"CalibrationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection
